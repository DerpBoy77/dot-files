general {
    lock_cmd = pidof hyprlock || hyprlock                                   # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # turn on screen after resume
}

# Lock screen after 5 minutes of inactivity (skip if already locked)
listener {
    timeout = 300                                                           # 5min
    on-timeout = pidof hyprlock || loginctl lock-session                     # lock screen when timeout has passed
}

# Turn off display after 5.5 minutes of inactivity (30 seconds after lock)
listener {
    timeout = 330                                                           # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'     # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'       # screen on when activity is detected
}